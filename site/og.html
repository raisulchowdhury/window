<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Window share image</title>
<link rel="stylesheet" href="panel.css">
<style>
/* Source for og.png (1200 x 630). Render it at that size and save the screenshot. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1E2A44}
.scene{position:relative;width:1200px;height:630px;background:linear-gradient(180deg,#1E2A44 0%,#3B4A6B 45%,#B9725A 82%,#E39A62 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;color:#F2F2F7;-webkit-font-smoothing:antialiased}
.bar{height:30px;background:rgba(20,22,26,.55);display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:0 20px;font-size:14px}
.item{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.18)}
.panel{position:absolute;top:44px;right:64px;zoom:1.32}
.copy{position:absolute;left:72px;bottom:80px;width:560px}
.mark{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600}
h1{margin:22px 0 0;font-size:58px;line-height:1.04;font-weight:600;letter-spacing:-1.4px}
</style>
</head>
<body>
<div class="scene">
  <div class="bar"><span class="item"><svg width="15" height="12" viewBox="0 0 14 12"><path d="M1 11V8M4 11V4M7 11V6M10 11V3M13 11V9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>17:30</span><span>Tue 16:58</span></div>
  <div class="copy">
    <div class="mark"><svg width="36" height="36" viewBox="0 0 22 22"><rect x=".5" y=".5" width="21" height="21" rx="6" fill="#1C1C1E" stroke="#3A3A3E"/><path d="M5 16v-3M8 16v-6M11 16v-4M14 16v-7M17 16v-2" stroke="#F2F2F7" stroke-width="1.4" stroke-linecap="round"/><path d="M11 4v4" stroke="#F5692B" stroke-width="1.6" stroke-linecap="round"/></svg>Window</div>
    <h1>Leave work when the drive is shortest.</h1>
  </div>
  <div class="panel"><div id="p"></div></div>
</div>
<script src="panel.js"></script>
<script>mountWindowPanel(document.getElementById('p'), { interactive: false });</script>
</body>
</html>
